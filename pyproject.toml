[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gsforge"
version = "0.1.0"
description = "3DGS -> simulation-ready mesh asset pipeline with an observe-think-act repair agent"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.4",
    "fast-simplification>=0.1.7",
    "scikit-image>=0.22",
    "plyfile>=1.0",
    "pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=2.3",  # server-side fallbacks, output_config, eager_input_streaming
]

[project.optional-dependencies]
# CPU geometry/texture extras that ship wheels on all platforms
geo = ["xatlas>=0.0.9", "manifold3d>=2.5", "pymeshlab>=2023.12", "coacd>=1.0"]
# GPU stack: gaussian rasterization, differentiable mesh rasterization
gpu = ["torch>=2.3", "gsplat>=1.4"]
# Distributed execution and cloud storage
cloud = ["ray[default]>=2.30", "boto3>=1.34"]
# Physics validation
sim = ["mujoco>=3.1"]
observability = ["opentelemetry-sdk>=1.25"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gsforge = "gsforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gsforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905"]  # typer Option defaults; zip over equal-length arrays by construction
